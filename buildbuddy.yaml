# Only the required parent is webhook-triggered. PRs run five representative
# stages; main runs all twelve exhaustive stages with full evidence gates.
actions:
  - name: Full test suite
    self_hosted: false
    timeout: 60m
    visibility: PUBLIC
    container_image: ubuntu-24.04
    # Bazel test actions use this repository's managed RBE execution platform.
    platform_properties:
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    resource_requests:
      cpu: 4
      memory: 8GB
    triggers:
      push:
        branches: [main]
      pull_request:
        branches: ["*"]
    steps:
      - run: tools/run_buildbuddy_ci.sh aggregate
  - name: Datadog PR scenarios
    self_hosted: false
    timeout: 60m
    visibility: PUBLIC
    container_image: ubuntu-24.04
    platform_properties:
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    resource_requests:
      cpu: 4
      memory: 8GB
    steps:
      - run: tools/run_buildbuddy_ci.sh stage "Datadog PR scenarios"
