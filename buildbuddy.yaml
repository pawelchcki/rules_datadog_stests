# Only the required parent is webhook-triggered. It starts every short stage
# on the same commit and verifies their complete evidence before reporting green.
actions:
  - name: Full test suite
    visibility: PUBLIC
    container_image: ubuntu-24.04
    # Bazel test actions use the configured self-hosted RBE execution platform.
    platform_properties:
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    resource_requests:
      cpu: 4
      memory: 8GB
    triggers:
      push:
        branches: [main]
      pull_request:
        branches: ["*"]
    steps:
      - run: tools/run_buildbuddy_ci.sh aggregate
  - name: Datadog scenarios
    visibility: PUBLIC
    container_image: ubuntu-24.04
    # Bazel test actions use the configured self-hosted RBE execution platform.
    platform_properties:
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    resource_requests:
      cpu: 4
      memory: 8GB
    steps:
      - run: tools/run_buildbuddy_ci.sh stage "Datadog scenarios"
