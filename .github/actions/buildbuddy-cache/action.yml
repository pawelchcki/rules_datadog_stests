name: BuildBuddy cache
description: Configure BuildBuddy cache and RBE credentials without uploading local results
inputs:
  api-key:
    description: BuildBuddy credential; unavailable on fork pull requests
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BUILDBUDDY_CACHE_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        if [[ -z "$BUILDBUDDY_CACHE_KEY" ]]; then
          echo 'BuildBuddy credential unavailable; using the GitHub disk/repository caches.'
          exit 0
        fi
        umask 077
        touch "$HOME/.bazelrc"
        chmod 600 "$HOME/.bazelrc"
        printf '\n' >> "$HOME/.bazelrc"
        cat >> "$HOME/.bazelrc" <<EOF
        common:buildbuddy-cache --remote_cache=grpcs://remote.buildbuddy.io
        common:buildbuddy-cache --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_CACHE_KEY
        common:buildbuddy --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_CACHE_KEY
        EOF
