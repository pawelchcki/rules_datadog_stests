name: Publish Datadog report

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: datadog-report-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
      - name: Fresh gated evidence
        shell: bash
        run: |
          set -euo pipefail
          images="$RUNNER_TEMP/datadog-images"
          evidence="$RUNNER_TEMP/datadog-evidence"
          mkdir -p "$images"
          : > "$images/bazel.flags"
          tools/run_datadog_parity.sh "$images" "$(git rev-parse HEAD)" "$evidence"
          mkdir -p _site
          cp "$evidence/datadog-report.html" _site/index.html
          cp "$evidence/datadog-report.html" _site/datadog-report.html
      - name: Retain proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: datadog-evidence
          path: ${{ runner.temp }}/datadog-evidence
          if-no-files-found: ignore
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
