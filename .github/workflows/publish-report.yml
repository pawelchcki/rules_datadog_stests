name: Publish Datadog report

on:
  workflow_run:
    workflows: [Datadog assertions]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful main-push Datadog assertions run containing the report
        type: number
        required: true

concurrency:
  group: datadog-report-pages
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify report source
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_RUN_ID: ${{ github.event.workflow_run.id || inputs.run-id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPORT_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python3 - <<'PYCODE'
          import json, os, pathlib
          run = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "source-run.json").read_text())
          assert run["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          assert run["head_branch"] == "main" and run["event"] == "push"
          assert run["path"] == ".github/workflows/test.yml" and run["conclusion"] == "success"
          PYCODE
      - name: Download verified report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: datadog-report
          path: _site
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
      - name: Prepare Pages index
        run: cp _site/datadog-report.html _site/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
