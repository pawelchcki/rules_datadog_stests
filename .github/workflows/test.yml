name: Datadog assertions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: datadog-assertions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate tracked Python, shell and JSON sources
        run: python3 tools/check_sources.py
  assertions:
    # Same-repository PRs are tested by BuildBuddy's required Full test suite.
    # Forks cannot access the trusted remote-execution credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
      - name: Configure BuildBuddy cache
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: bazel test --config=ci-cache --build_tests_only //...
      - name: Verify external consumer
        working-directory: examples/plugin_agent
        run: bazel build --config=ci-cache //:telemetry_api_check
      - name: Fresh gated Datadog evidence
        shell: bash
        run: |
          set -euo pipefail
          images="$RUNNER_TEMP/datadog-images"
          evidence="$RUNNER_TEMP/datadog-evidence"
          mkdir -p "$images"
          : > "$images/bazel.flags"
          DATADOG_BAZEL_CONFIG=ci-cache tools/run_datadog_parity.sh "$images" "$(git rev-parse HEAD)" "$evidence"
      - name: Retain publishable proof report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: datadog-report
          path: ${{ runner.temp }}/datadog-evidence/datadog-report.html
          if-no-files-found: error
      - name: Retain proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: datadog-evidence
          path: ${{ runner.temp }}/datadog-evidence
          if-no-files-found: ignore
